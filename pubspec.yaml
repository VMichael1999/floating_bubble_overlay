name: floating_bubble_overlay
description: "Customizable Messenger-style floating bubble (chat head) overlay for Flutter on Android, with drag-to-close, tap and move callbacks, and a foreground service notification."
version: 1.1.0
homepage: https://github.com/VMichael1999/floating_bubble_overlay
repository: https://github.com/VMichael1999/floating_bubble_overlay
issue_tracker: https://github.com/VMichael1999/floating_bubble_overlay/issues
topics:
  - overlay
  - floating-bubble
  - chat-head
  - android

environment:
  sdk: ^3.7.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.floating_bubble_overlay
        pluginClass: FloatingBubbleOverlayPlugin
